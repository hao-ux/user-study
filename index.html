<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图像生成模型 · 组级盲测评估台 (云端版)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14171a; --bg-alt:#1b1f22; --panel:#e7e3da; --panel-line:#c9c4b7; --text:#ece9e1; --text-dim:#8f979c; --text-on-panel:#2a2723; --accent:#c1502e; --accent-soft:#c1502e22; --ok:#7fa98e; --line:rgba(255,255,255,0.09); --radius:3px; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); background:var(--bg-alt); position:sticky; top:0; z-index:30;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{width:9px;height:9px;background:var(--accent);border-radius:50%;display:inline-block;}
  .brand h1{font-size:17px; font-weight:600;}
  .brand .sub{color:var(--text-dim); font-size:12px; letter-spacing:.04em; text-transform:uppercase;}
  .progress-wrap{display:flex; align-items:center; gap:12px;}
  .progress-track{width:180px; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .25s ease;}
  .progress-label{font-size:12px; color:var(--text-dim);}

  main{max-width:1180px; margin:0 auto; padding:36px 28px 80px;}
  section{display:none;}
  section.active{display:block; animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .card{background:var(--bg-alt); border:1px solid var(--line); border-radius:8px; padding:26px 28px; margin-bottom:20px;}
  .lede{color:var(--text-dim); font-size:14px; line-height:1.7; max-width:680px;}
  label.field-label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:8px; margin-top:22px;}
  label.field-label:first-child{margin-top:0;}
  .field-hint{color:var(--text-dim); font-size:12.5px; margin-top:6px; line-height:1.6;}

  input[type=text], textarea{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:var(--radius); font-family:'Inter',sans-serif; font-size:14px;}
  textarea{resize:vertical; min-height:110px; line-height:1.6;}
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--accent);}

  .filebtn{position:relative; display:inline-flex; align-items:center; gap:10px; background:var(--bg); border:1px dashed var(--line); border-radius:var(--radius); padding:12px 16px; cursor:pointer; width:100%;}
  .filebtn:hover{border-color:var(--accent);}
  .filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%;}
  .filebtn .name{font-size:13px; color:var(--text-dim);}
  
  .row{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:760px){.row{grid-template-columns:1fr;}}

  .checkline{display:flex; align-items:center; gap:9px; margin-top:16px; font-size:13.5px; color:var(--text-dim);}
  .checkline input{accent-color:var(--accent); width:15px; height:15px;}

  button.primary, button.secondary, button.ghost{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; border-radius:var(--radius); padding:12px 22px; cursor:pointer; border:1px solid transparent; transition:transform .12s ease, background .15s ease;}
  button.primary{background:var(--accent); color:#fff;}
  button.primary:hover{transform:translateY(-1px);}
  button.primary:disabled{background:var(--line); color:var(--text-dim); cursor:not-allowed; transform:none;}
  button.secondary{background:transparent; border-color:var(--line); color:var(--text);}
  button.secondary:hover{border-color:var(--accent); color:var(--accent);}
  button.ghost{background:transparent; border:none; color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:500; text-decoration:underline; padding:6px;}
  button.ghost:hover{color:var(--text);}
  .actions{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; align-items:center;}

  .warn{margin-top:16px; padding:12px 14px; border-radius:var(--radius); background:#c1502e15; border:1px solid #c1502e40; color:#e2a288; font-size:13px; line-height:1.6;}
  .okmsg{margin-top:16px; padding:12px 14px; border-radius:var(--radius); background:#7fa98e15; border:1px solid #7fa98e40; color:#a9c9b6; font-size:13px; line-height:1.6;}

  /* ---- Study screen ---- */
  .meta-strip{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .meta-strip .group-name{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
  .meta-strip .hint2{font-size:12.5px; color:var(--text-dim);}

  .ref-strip{background:var(--panel); border-radius:8px; padding:16px 18px; margin-bottom:16px;}
  .ref-strip .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-on-panel); opacity:.65; margin-bottom:10px; display:block;}
  .ref-grid{display:flex; gap:16px; flex-wrap:wrap;}
  
  .stage{background:var(--panel); border-radius:8px; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media (max-width:820px){.stage{grid-template-columns:1fr;}}
  .col{display:flex; flex-direction:column; gap:16px; min-width:0;}
  .col-head{display:flex; align-items:center; justify-content:space-between;}
  .col-head .tag{font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--text-on-panel); color:var(--panel); padding:4px 9px; border-radius:2px; letter-spacing:.04em;}
  .col-head .count{font-size:11.5px; color:var(--text-on-panel); opacity:.6;}
  
  /* --- 图片组及卡片样式更新（竖排大图显示） --- */
  .thumb-grid{display:flex; flex-direction:column; gap:36px; align-items:center;}
  .thumb-wrap{display:flex; flex-direction:column; gap:12px; width:100%;}
  .thumb{background:#fff; border:1px solid var(--panel-line); border-radius:6px; overflow:hidden; cursor:zoom-in; position:relative; width:100%;}
  .thumb img{width:100%; height:auto; object-fit:contain; display:block;}
  .thumb:hover{border-color:var(--accent);}
  .thumb-prompt{font-family:'Inter', sans-serif; font-size:13.5px; color:var(--text-dim); line-height:1.5; text-align:center; word-break:break-word; padding:0 8px;}

  .criteria{margin-top:22px;}
  .qrow{display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .qrow .qtext{font-size:14px; max-width:560px; line-height:1.55;}
  .qtext .qnum{color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:12px; margin-right:8px;}
  .choices{display:flex; gap:8px; flex-shrink:0;}
  .choice-btn{font-family:'Inter',sans-serif; font-size:13px; font-weight:500; padding:9px 14px; border:1px solid var(--line); background:transparent; color:var(--text-dim); border-radius:var(--radius); cursor:pointer; transition:all .12s ease;}
  .choice-btn:hover{border-color:var(--accent); color:var(--text);}
  .choice-btn.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .choice-btn.sel.tie{background:var(--text-dim); border-color:var(--text-dim);}

  .navbar{display:flex; justify-content:space-between; align-items:center; margin-top:26px;}
  .navbar .left-controls, .navbar .right-controls{display:flex; gap:10px; align-items:center;}

  /* lightbox */
  .lightbox{position:fixed; inset:0; background:rgba(10,10,10,0.92); display:none; align-items:center; justify-content:center; z-index:100; padding:40px; flex-direction:column; gap:14px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:90vw; max-height:78vh; object-fit:contain; border-radius:4px;}
  .lightbox .cap{color:var(--text-dim); font-size:14px; text-align:center; max-width:80vw;}
  .lightbox .close{position:absolute; top:22px; right:28px; color:var(--text); font-size:22px; cursor:pointer; background:none; border:none;}

  /* ---- Summary ---- */
  .stat-block{margin-bottom:26px;}
  .stat-block h3{font-size:14.5px; margin-bottom:14px; font-weight:600;}
  .bars{display:flex; flex-direction:column; gap:8px;}
  .bar-row{display:grid; grid-template-columns:70px 1fr 60px; align-items:center; gap:12px; font-size:12.5px;}
  .bar-track{height:10px; background:var(--bg); border-radius:5px; overflow:hidden; display:flex;}
  .bar-fill{height:100%;}
  .bar-fill.a{background:var(--accent);}
  .bar-fill.b{background:#6f8ea3;}
  .bar-fill.t{background:var(--line);}

  footer.hint{color:var(--text-dim); font-size:12px; text-align:center; margin-top:40px; line-height:1.7;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <h1>组级盲测评估台</h1>
    <span class="sub mono">Cloud-hosted A/B Blind Comparison</span>
  </div>
  <div class="progress-wrap" id="progressWrap" style="display:none;">
    <span class="progress-label mono" id="progressLabel">0 / 0</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<main>
  <!-- ===================== SETUP ===================== -->
  <section id="screen-setup" class="active">
    <div class="card">
      <h2>1 · 云端数据加载</h2>
      <div id="matchInfo">
        <div class="field-hint" style="color:var(--text);">正在请求 config.json，请稍候...</div>
      </div>
    </div>

    <div class="card">
      <h2>2 · 评估设置</h2>
      <div class="row">
        <div>
          <label class="field-label">评审员姓名 / 编号</label>
          <input type="text" id="raterName" placeholder="例如 rater_01 (必填)" required>
        </div>
        <div>
          <label class="field-label">研究标题（会写入导出文件）</label>
          <input type="text" id="studyTitle" placeholder="例如 主体驱动生成模型对比实验">
        </div>
      </div>

      <label class="field-label">评估维度（针对"整组图片"作答）</label>
      <textarea id="criteriaBox">同一主体在该组不同图片间是否保持一致的标志性细节以及是否更自然、真实，局部失真更少</textarea>

      <label class="checkline">
        <input type="checkbox" id="blindToggle" checked>
        随机决定左右哪一列显示模型A/B并隐藏来源（双盲推荐）
      </label>
      <label class="checkline">
        <input type="checkbox" id="shuffleToggle" checked>
        随机打乱各组呈现顺序
      </label>
    </div>

    <div class="card">
      <h2>3 · 开始 / 恢复</h2>
      <div class="actions">
        <button class="primary" id="startBtn" disabled>开始评测</button>
        <div class="filebtn" style="width:auto; padding:12px 16px;">
          <span class="name" id="nameImport">导入进度 JSON（断点续做）</span>
          <input type="file" id="inputImport" accept="application/json">
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== STUDY ===================== -->
  <section id="screen-study">
    <div class="card">
      <div class="meta-strip">
        <span class="group-name mono" id="stGroup">—</span>
        <span class="hint2" id="stHint">点击任意图片可放大查看细节</span>
      </div>
      <div id="refStrip"></div>
      <div class="stage" id="stage">
        <div class="col">
          <div class="col-head"><span class="tag">图片组 1</span><span class="count" id="countLeft"></span></div>
          <div class="thumb-grid" id="gridLeft"></div>
        </div>
        <div class="col">
          <div class="col-head"><span class="tag">图片组 2</span><span class="count" id="countRight"></span></div>
          <div class="thumb-grid" id="gridRight"></div>
        </div>
      </div>
      <div class="criteria" id="criteriaList"></div>
      <div class="navbar">
        <div class="left-controls">
          <button class="secondary" id="prevBtn">← 上一组</button>
          <button class="ghost" id="skipBtn">跳过本组</button>
        </div>
        <div class="right-controls">
          <button class="ghost" id="exportProgressBtn">保存当前进度</button>
          <button class="primary" id="nextBtn" disabled>下一组 →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== SUMMARY ===================== -->
  <section id="screen-summary">
    <div class="card">
      <h2>评估完成</h2>
      <p class="lede" id="summaryLede"></p>
      <div id="statBlocks"></div>
      <div class="actions">
        <button class="primary" id="downloadCsvBtn">下载最终 CSV</button>
        <button class="secondary" id="downloadJsonBtn">下载完整 JSON</button>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
  <div class="cap" id="lightboxCap"></div>
</div>

<script>
(function(){
  let groups = [];
  let order = [];
  let assignment = [];
  let responses = [];
  let criteria = [];
  let current = 0;
  let blindMode = true;

  // 通过路径提取 Prompt（去除路径和扩展名）
  function promptOf(path){ 
    const parts = path.split('/');
    const filename = parts[parts.length - 1];
    return filename.replace(/\.[^/.]+$/, ''); 
  }
  
  function shuffle(arr){
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function csvEscape(s){
    s = String(s ?? '');
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  // ---------- 1. 加载云端配置 ----------
  const matchInfo = document.getElementById('matchInfo');
  const startBtn = document.getElementById('startBtn');

  fetch('config.json')
    .then(res => {
      if(!res.ok) throw new Error('Network response was not ok');
      return res.json();
    })
    .then(data => {
      groups = data.groups;
      if(groups && groups.length > 0){
        matchInfo.innerHTML = `<div class="okmsg">✅ 成功加载云端配置！共发现 <b>${groups.length}</b> 组对比数据。</div>`;
        startBtn.disabled = false;
      } else {
        matchInfo.innerHTML = `<div class="warn">❌ config.json 解析成功，但内无图片组数据。</div>`;
      }
    })
    .catch(err => {
      matchInfo.innerHTML = `<div class="warn">❌ 无法读取 config.json，请确保已通过 Python 脚本生成该文件，且已与 HTML 一同上传至服务器。</div>`;
      console.error(err);
    });

  let importedResponses = null;
  document.getElementById('inputImport').addEventListener('change', e=>{
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        importedResponses = data.responses || null;
        document.getElementById('nameImport').textContent = `已导入 ${importedResponses ? importedResponses.length : 0} 条记录`;
        document.getElementById('raterName').value = data.rater || '';
        document.getElementById('studyTitle').value = data.studyTitle || '';
        if (Array.isArray(data.criteria) && data.criteria.length){
          document.getElementById('criteriaBox').value = data.criteria.map(c=>c.question).join('\n');
        }
      }catch(err){ alert('导入失败：JSON 格式无法解析'); }
    };
    reader.readAsText(f);
  });

  startBtn.addEventListener('click', () => {
    const rater = document.getElementById('raterName').value.trim();
    if(!rater){ alert('请填写评审员姓名/编号！'); return; }

    const lines = document.getElementById('criteriaBox').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if (lines.length === 0){ alert('请至少填写一条评估维度'); return; }
    criteria = lines.map((q,i)=>({ id:`q${i+1}`, question:q }));

    blindMode = document.getElementById('blindToggle').checked;
    const doShuffle = document.getElementById('shuffleToggle').checked;

    const idxs = groups.map((_,i)=>i);
    order = doShuffle ? shuffle(idxs) : idxs;

    assignment = groups.map(()=>{
      const flip = blindMode ? Math.random() < 0.5 : false;
      return flip ? {left:'B', right:'A'} : {left:'A', right:'B'};
    });

    responses = groups.map(g => {
      if (importedResponses){
        const prev = importedResponses.find(r => r.folder === g.folder);
        if (prev) return { answers: prev.answers || {}, skipped: !!prev.skipped, ts: prev.ts || Date.now() };
      }
      return { answers:{}, skipped:false, ts:null };
    });

    current = 0;
    for (let i=0;i<order.length;i++){
      const r = responses[order[i]];
      const done = criteria.every(c => r.answers[c.id]);
      if (!done && !r.skipped){ current = i; break; }
      current = i;
    }

    document.getElementById('progressWrap').style.display = 'flex';
    showScreen('study');
    renderCurrent();
  });

  // ---------- Study screen ----------
  const stGroup = document.getElementById('stGroup');
  const refStrip = document.getElementById('refStrip');
  const gridLeft = document.getElementById('gridLeft');
  const gridRight = document.getElementById('gridRight');
  const countLeft = document.getElementById('countLeft');
  const countRight = document.getElementById('countRight');
  const criteriaList = document.getElementById('criteriaList');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const skipBtn = document.getElementById('skipBtn');
  const progressLabel = document.getElementById('progressLabel');
  const progressFill = document.getElementById('progressFill');

  function currentGroupIndex(){ return order[current]; }

  function renderThumbGrid(container, paths){
    container.innerHTML = '';
    paths.forEach(p => {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';

      const cell = document.createElement('div');
      cell.className = 'thumb';
      
      const img = document.createElement('img');
      img.src = p; // 直接使用 config.json 中记录的路径
      img.alt = promptOf(p);
      img.loading = 'lazy'; // 云端加载必须加懒加载
      
      cell.appendChild(img);
      cell.addEventListener('click', () => openLightbox(p));

      const promptNode = document.createElement('div');
      promptNode.className = 'thumb-prompt';
      promptNode.textContent = promptOf(p);
      promptNode.title = promptOf(p);

      wrap.appendChild(cell);
      wrap.appendChild(promptNode);
      container.appendChild(wrap);
    });
  }

  function renderCurrent(){
    const gi = currentGroupIndex();
    const g = groups[gi];
    const asg = assignment[gi];
    const filesLeft = asg.left === 'A' ? g.filesA : g.filesB;
    const filesRight = asg.right === 'A' ? g.filesA : g.filesB;

    stGroup.textContent = g.folder;
    countLeft.textContent = `${filesLeft.length} 张`;
    countRight.textContent = `${filesRight.length} 张`;
    renderThumbGrid(gridLeft, filesLeft);
    renderThumbGrid(gridRight, filesRight);

    refStrip.innerHTML = '';
    if (g.filesRef && g.filesRef.length){
      const box = document.createElement('div');
      box.className = 'ref-strip';
      box.innerHTML = `<span class="lbl">参考主体（${g.folder}）</span><div class="ref-grid" style="align-items:start;"></div>`;
      const rg = box.querySelector('.ref-grid');
      g.filesRef.forEach(p=>{
        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrap';
        wrap.style.width = '120px'; 

        const cell = document.createElement('div');
        cell.className = 'thumb';
        
        const img = document.createElement('img');
        img.src = p;
        img.alt = promptOf(p);
        img.addEventListener('click', ()=> openLightbox(p));
        img.style.cursor = 'zoom-in';

        const pt = document.createElement('div');
        pt.className = 'thumb-prompt';
        pt.textContent = promptOf(p);
        pt.title = promptOf(p);

        cell.appendChild(img);
        wrap.appendChild(cell);
        wrap.appendChild(pt);
        rg.appendChild(wrap);
      });
      refStrip.appendChild(box);
    }

    const r = responses[gi];
    criteriaList.innerHTML = '';
    criteria.forEach((c, idx) => {
      const row = document.createElement('div');
      row.className = 'qrow';
      const sel = r.answers[c.id];
      row.innerHTML = `
        <div class="qtext"><span class="qnum">Q${idx+1}</span>${c.question}</div>
        <div class="choices">
          <button class="choice-btn ${sel==='left'?'sel':''}" data-choice="left">左组更好</button>
          <button class="choice-btn tie ${sel==='tie'?'sel':''}" data-choice="tie">差不多</button>
          <button class="choice-btn ${sel==='right'?'sel':''}" data-choice="right">右组更好</button>
        </div>`;
      row.querySelectorAll('.choice-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          r.answers[c.id] = btn.dataset.choice;
          r.ts = Date.now();
          renderCurrent();
        });
      });
      criteriaList.appendChild(row);
    });

    const allAnswered = criteria.every(c => r.answers[c.id]);
    nextBtn.disabled = !allAnswered;
    prevBtn.disabled = current === 0;
    nextBtn.textContent = (current === order.length -1) ? '完成评测 →' : '下一组 →';

    progressLabel.textContent = `${current+1} / ${order.length}`;
    progressFill.style.width = `${((current+1)/order.length)*100}%`;
    //window.scrollTo({top: 0, behavior: 'smooth'}); // 切换时自动回到顶部
  }

  prevBtn.addEventListener('click', ()=>{ if (current>0){ current--; renderCurrent(); } });
  skipBtn.addEventListener('click', ()=>{ responses[currentGroupIndex()].skipped = true; advance(); });
  nextBtn.addEventListener('click', advance);

  function advance(){
    if (current === order.length -1){ finishStudy(); return; }
    current++;
    renderCurrent();
  }
  function finishStudy(){ showScreen('summary'); renderSummary(); }

  // lightbox
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCap = document.getElementById('lightboxCap');
  function openLightbox(path){
    lightboxImg.src = path;
    lightboxCap.textContent = promptOf(path);
    lightbox.classList.add('open');
  }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{ if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeLightbox(); });

  // ---------- export ----------
  function buildRecords(){
    return order.map(gi => {
      const g = groups[gi];
      const asg = assignment[gi];
      const r = responses[gi];
      const rec = {
        folder: g.folder,
        left_model: asg.left,
        right_model: asg.right,
        left_count: (asg.left==='A'?g.filesA:g.filesB).length,
        right_count: (asg.right==='A'?g.filesA:g.filesB).length,
        skipped: r.skipped,
        answers: {}
      };
      criteria.forEach(c => {
        const choice = r.answers[c.id];
        let winner = null;
        if (choice==='left') winner = asg.left;
        else if (choice==='right') winner = asg.right;
        else if (choice==='tie') winner = 'tie';
        rec.answers[c.id] = { question:c.question, side_choice: choice||null, winning_model: winner };
      });
      return rec;
    });
  }
  function downloadBlob(content, filename, type){
    const blob = new Blob([content], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  document.getElementById('exportProgressBtn').addEventListener('click', ()=>{
    const data = {
      rater: document.getElementById('raterName').value || '',
      studyTitle: document.getElementById('studyTitle').value || '',
      criteria,
      exportedAt: new Date().toISOString(),
      responses: order.map(gi => ({ folder: groups[gi].folder, answers: responses[gi].answers, skipped: responses[gi].skipped, ts: responses[gi].ts }))
    };
    downloadBlob(JSON.stringify(data, null, 2), 'user_study_progress.json', 'application/json');
  });

  document.getElementById('downloadCsvBtn').addEventListener('click', ()=>{
    const records = buildRecords();
    const header = ['group_index','folder','left_model','right_model','left_count','right_count','skipped',
      ...criteria.flatMap(c => [`${c.id}_side_choice`, `${c.id}_winning_model`])];
    const rows = [header.join(',')];
    records.forEach((rec,i)=>{
      const row = [i+1, rec.folder, rec.left_model, rec.right_model, rec.left_count, rec.right_count, rec.skipped];
      criteria.forEach(c=>{ row.push(rec.answers[c.id].side_choice||''); row.push(rec.answers[c.id].winning_model||''); });
      rows.push(row.map(csvEscape).join(','));
    });
    downloadBlob('\uFEFF' + rows.join('\n'), `user_study_results_${document.getElementById('raterName').value}.csv`, 'text/csv;charset=utf-8');
  });

  document.getElementById('downloadJsonBtn').addEventListener('click', ()=>{
    const data = {
      rater: document.getElementById('raterName').value || '',
      studyTitle: document.getElementById('studyTitle').value || '',
      criteria, blindMode,
      exportedAt: new Date().toISOString(),
      records: buildRecords()
    };
    downloadBlob(JSON.stringify(data, null, 2), `user_study_results_${document.getElementById('raterName').value}.json`, 'application/json');
  });

  function renderSummary(){
    const records = buildRecords();
    const total = records.filter(r=>!r.skipped).length;
    document.getElementById('summaryLede').textContent =
      `共完成 ${total} / ${records.length} 组比较（跳过 ${records.length-total} 组）。下方为各评估维度下 模型A / 模型B / 差不多 的胜出占比。`;
    const container = document.getElementById('statBlocks');
    container.innerHTML = '';
    criteria.forEach(c => {
      let a=0,b=0,t=0,n=0;
      records.forEach(r=>{
        if (r.skipped) return;
        const w = r.answers[c.id].winning_model;
        if (w==='A'){a++;n++;} else if (w==='B'){b++;n++;} else if (w==='tie'){t++;n++;}
      });
      const pct = x => n ? Math.round(x/n*100) : 0;
      const block = document.createElement('div');
      block.className = 'stat-block';
      block.innerHTML = `
        <h3>${c.question}</h3>
        <div class="bars">
          <div class="bar-row"><span>模型 A</span><div class="bar-track"><div class="bar-fill a" style="width:${pct(a)}%"></div></div><span class="mono">${pct(a)}% (${a})</span></div>
          <div class="bar-row"><span>模型 B</span><div class="bar-track"><div class="bar-fill b" style="width:${pct(b)}%"></div></div><span class="mono">${pct(b)}% (${b})</span></div>
          <div class="bar-row"><span>差不多</span><div class="bar-track"><div class="bar-fill t" style="width:${pct(t)}%"></div></div><span class="mono">${pct(t)}% (${t})</span></div>
        </div>`;
      container.appendChild(block);
    });
  }

  function showScreen(name){
    ['setup','study','summary'].forEach(s=>{
      document.getElementById('screen-'+s).classList.toggle('active', s===name);
    });
    if (name !== 'study') document.getElementById('progressWrap').style.display = name==='setup' ? 'none' : 'flex';
  }
})();
</script>
</body>
</html>
